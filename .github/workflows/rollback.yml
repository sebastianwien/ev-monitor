name: Rollback Production

# Manueller Rollback. Ohne Commit: zurück auf den Stand vor dem letzten Deploy
# (release.env.prev auf dem Server). Mit Commit: genau dieses Image starten, es muss
# in GHCR liegen (jeder Build auf main pusht eins). Datenbank-Migrationen werden nicht
# zurückgedreht, Pre-Deploy-Dumps liegen in /opt/ev-monitor/backup/predeploy/.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Volle Commit-SHA, 40 Zeichen (leer = vorheriger Stand)'
        required: false
        default: ''

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Rollback on Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN,TARGET
          script: |
            if [ -z "$TARGET" ]; then
              bash /opt/ev-monitor/ev-monitor-infra/scripts/deploy-release.sh core --rollback
            else
              bash /opt/ev-monitor/ev-monitor-infra/scripts/deploy-release.sh core "$TARGET"
            fi
