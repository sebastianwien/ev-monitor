name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Tests
        run: |
          cd backend
          ./gradlew test

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /opt/ev-monitor/ev-monitor
            echo "🔄 Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "🗄️  Creating database backup..."
            docker compose -f docker-compose.full.yml exec -T db pg_dump -U evmonitor ev_monitor > backup-$(date +%Y%m%d-%H%M%S).sql || echo "⚠️  Backup failed (DB might not be running yet)"

            echo "🚀 Deploying application..."
            flock -w 180 /tmp/ev-monitor-deploy.lock ./deploy.sh

            echo "✅ Deployment completed at $(date)"

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            echo "⏳ Waiting for backend to become healthy (max 3 minutes)..."
            for i in $(seq 1 18); do
              if docker compose -f /opt/ev-monitor/ev-monitor/docker-compose.full.yml exec -T backend curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Backend healthy after $((i*10)) seconds"
                exit 0
              fi
              echo "Attempt $i/18 failed, retrying in 10s..."
              sleep 10
            done
            echo "❌ Backend health check failed — dumping logs:"
            cd /opt/ev-monitor/ev-monitor && docker compose -f docker-compose.full.yml logs backend --tail=50
            exit 1

      - name: Prerender smoke test on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /opt/ev-monitor/ev-monitor
            ./scripts/test-prerender.sh https://ev-monitor.net

      - name: Warm prerender cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /opt/ev-monitor/ev-monitor
            mkdir -p logs
            echo "🔥 Starting prerender cache warmer in background..."
            nohup ./scripts/warm-prerender-cache.sh > /opt/ev-monitor/ev-monitor/logs/prerender-warm.log 2>&1 &
            echo "✅ Cache warmer started (PID $!), see /opt/ev-monitor/ev-monitor/logs/prerender-warm.log"

      - name: Install prerender cache warmer cron job
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            CRON_LINE="17 4 * * * /opt/ev-monitor/ev-monitor/scripts/warm-prerender-cache.sh >> /opt/ev-monitor/ev-monitor/logs/prerender-warm.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "warm-prerender-cache"; echo "$CRON_LINE") | crontab -
            echo "✅ Cron job set: $(crontab -l | grep warm-prerender-cache)"

  # Capgo Live-Update: baut das App-Mode-Bundle, laedt es auf den Server und
  # registriert es am Backend. Laeuft NACH dem Deploy (Endpoint muss existieren).
  # Wird uebersprungen, wenn APP_BUNDLE_PUBLISH_TOKEN nicht gesetzt ist.
  publish-live-update:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      PUBLISH_TOKEN: ${{ secrets.APP_BUNDLE_PUBLISH_TOKEN }}

    steps:
      - name: Check publish token configured
        id: guard
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "⚠️  APP_BUNDLE_PUBLISH_TOKEN not set - skipping live-update publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Set up Node.js 20
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build app-mode bundle and zip with Capgo CLI
        id: zip
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd frontend
          npm ci
          npm run build:app
          VERSION="1.0.${{ github.run_number }}"
          # bundle zip schreibt die Zip-Datei nach ./$VERSION und gibt {checksum,...} als JSON aus
          npx --yes @capgo/cli bundle zip --path dist --name "$VERSION" --json > capgo-out.json
          CHECKSUM="$(jq -r '.checksum' capgo-out.json)"
          mv "$VERSION" "$VERSION.zip"
          if [ -z "$CHECKSUM" ] || [ "$CHECKSUM" = "null" ]; then
            echo "❌ Capgo CLI lieferte keinen Checksum"; cat capgo-out.json; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "✅ Bundle $VERSION gezippt (sha256 $CHECKSUM)"

      - name: Upload bundle to server
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: frontend/${{ steps.zip.outputs.version }}.zip
          target: /opt/ev-monitor/app-bundles/
          strip_components: 1

      - name: Register bundle at backend
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -fsS -X POST https://ev-monitor.net/api/app/bundles \
            -H "X-App-Bundle-Token: $PUBLISH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${{ steps.zip.outputs.version }}\",\"checksum\":\"${{ steps.zip.outputs.checksum }}\"}"
          echo "✅ Bundle ${{ steps.zip.outputs.version }} registriert"

      - name: Rotate old bundles (older than 30 days)
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            find /opt/ev-monitor/app-bundles -maxdepth 1 -name '*.zip' -mtime +30 -delete
            echo "✅ Alte Bundles (>30 Tage) bereinigt"
