name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

# Images liegen privat in GHCR, Tag = Commit-SHA (auf main zusätzlich latest-main).
# Der Server baut nichts mehr, er startet genau das hier getestete Jar und Frontend.
env:
  BACKEND_IMAGE: ghcr.io/sebastianwien/ev-monitor-backend
  NGINX_IMAGE: ghcr.io/sebastianwien/ev-monitor-nginx

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Tests and build jar
        run: |
          cd backend
          ./gradlew test bootJar
          # Neben dem Boot-Jar liegt ein -plain.jar, fürs Image nur das Boot-Jar
          find build/libs -name '*.jar' ! -name '*-plain.jar' -exec cp {} build/app.jar \;

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      # Dieser Build landet im nginx-Image, deshalb mit den Prod-Werten
      - name: Build Frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_REDDIT_PIXEL_ID: ${{ secrets.VITE_REDDIT_PIXEL_ID }}
          VITE_GOOGLE_OAUTH_ENABLED: 'true'
        run: |
          cd frontend
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prebuilt
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest-main', env.BACKEND_IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          target: prebuilt
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest-main', env.NGINX_IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    # Nie zwei Deploys gleichzeitig, wartende nicht abbrechen. Gegen die anderen
    # Repos schützt der flock auf dem Server (Gruppen gelten nur pro Repo).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      # Zieht die Images, setzt die Tags in release.env, wartet auf healthy und
      # rollt bei Fehler automatisch auf den vorherigen Stand zurück.
      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          # Default 10m reicht nicht, wenn auf den Lock eines anderen Deploys gewartet wird
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN,SHA
          script: |
            bash /opt/ev-monitor/ev-monitor-infra/scripts/deploy-release.sh core "$SHA"

      - name: Prerender smoke test on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /opt/ev-monitor/ev-monitor
            ./scripts/test-prerender.sh https://ev-monitor.net

      - name: Warm prerender cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /opt/ev-monitor/ev-monitor
            mkdir -p logs
            echo "🔥 Starting prerender cache warmer in background..."
            nohup ./scripts/warm-prerender-cache.sh > /opt/ev-monitor/ev-monitor/logs/prerender-warm.log 2>&1 &
            echo "✅ Cache warmer started (PID $!), see /opt/ev-monitor/ev-monitor/logs/prerender-warm.log"

      - name: Install prerender cache warmer cron job
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            CRON_LINE="17 4 * * * /opt/ev-monitor/ev-monitor/scripts/warm-prerender-cache.sh >> /opt/ev-monitor/ev-monitor/logs/prerender-warm.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "warm-prerender-cache"; echo "$CRON_LINE") | crontab -
            echo "✅ Cron job set: $(crontab -l | grep warm-prerender-cache)"

  # Capgo Live-Update, Teil 1: App-Mode-Bundle bauen und auf den Server legen.
  # Haengt nur an `test`, laeuft also parallel zu `deploy` - das Bundle ist vom
  # Deployment unabhaengig, erst die Registrierung braucht das neue Backend.
  # Wird uebersprungen, wenn APP_BUNDLE_PUBLISH_TOKEN nicht gesetzt ist.
  build-live-update:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      PUBLISH_TOKEN: ${{ secrets.APP_BUNDLE_PUBLISH_TOKEN }}
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      version: ${{ steps.zip.outputs.version }}
      checksum: ${{ steps.zip.outputs.checksum }}

    steps:
      - name: Check publish token configured
        id: guard
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "⚠️  APP_BUNDLE_PUBLISH_TOKEN not set - skipping live-update publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Set up Node.js 22
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build app-mode bundle and zip with Capgo CLI
        id: zip
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd frontend
          npm ci
          npm run build:app
          VERSION="1.0.${{ github.run_number }}"
          # bundle zip schreibt die Zip-Datei nach ./$VERSION und gibt {checksum,...} als JSON aus
          npx --yes @capgo/cli bundle zip --path dist --name "$VERSION" --json > capgo-out.json
          CHECKSUM="$(jq -r '.checksum' capgo-out.json)"
          mv "$VERSION" "$VERSION.zip"
          if [ -z "$CHECKSUM" ] || [ "$CHECKSUM" = "null" ]; then
            echo "❌ Capgo CLI lieferte keinen Checksum"; cat capgo-out.json; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "✅ Bundle $VERSION gezippt (sha256 $CHECKSUM)"

      - name: Upload bundle to server
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: frontend/${{ steps.zip.outputs.version }}.zip
          target: /opt/ev-monitor/app-bundles/
          strip_components: 1

      - name: Rotate old bundles (older than 30 days)
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            find /opt/ev-monitor/app-bundles -maxdepth 1 -name '*.zip' -mtime +30 -delete
            echo "✅ Alte Bundles (>30 Tage) bereinigt"

  # Capgo Live-Update, Teil 2: das hochgeladene Bundle am Backend registrieren.
  # Erst hier wird das Update fuer die Clients sichtbar, deshalb braucht dieser
  # Schritt das fertige Deployment (der Endpoint muss die neue Version kennen).
  publish-live-update:
    needs: [deploy, build-live-update]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-live-update.outputs.skip != 'true'
    env:
      PUBLISH_TOKEN: ${{ secrets.APP_BUNDLE_PUBLISH_TOKEN }}

    steps:
      - name: Register bundle at backend
        run: |
          curl -fsS -X POST https://ev-monitor.net/api/app/bundles \
            -H "X-App-Bundle-Token: $PUBLISH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${{ needs.build-live-update.outputs.version }}\",\"checksum\":\"${{ needs.build-live-update.outputs.checksum }}\"}"
          echo "✅ Bundle ${{ needs.build-live-update.outputs.version }} registriert"
