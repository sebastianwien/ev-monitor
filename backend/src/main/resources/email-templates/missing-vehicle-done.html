<!DOCTYPE html>
<html lang="de">
<body style="font-family: Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px;">
  <div style="max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <h1 style="color: #4f46e5; font-size: 26px; margin-bottom: 4px;">EV Monitor</h1>
    <p style="color: #1f2937; line-height: 1.7; font-size: 15px;">
      Hi,
    </p>
    <p style="color: #6b7280; line-height: 1.7; font-size: 15px;">
      du hattest beim Anlegen deines Autos gemeldet, dass etwas fehlt: <strong>{{vehicle}}</strong>. Die Daten sind jetzt da, du kannst dein Auto anlegen.
    </p>
    <div style="text-align: center; margin: 36px 0;">
      <a href="{{carsUrl}}"
         style="display: inline-block; background-color: #16a34a; color: #ffffff; padding: 14px 36px;
                border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px;">
        Auto anlegen
      </a>
    </div>
    <p style="color: #6b7280; line-height: 1.7; font-size: 14px;">
      Deine Mail-Adresse habe ich nur für diese Rückmeldung genutzt und lösche sie in 30 Tagen aus der Meldung.
    </p>
    <p style="color: #1f2937; font-size: 15px; margin-top: 8px;">
      Danke dir!<br>
      Sebastian
    </p>
  </div>
</body>
</html>
