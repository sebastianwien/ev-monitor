spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: ev-monitor

  servlet:
    multipart:
      # Headroom fuer XPeng-Excel-Uploads (EU-Data-Act-Exports ~30-50 MB, groessere Zeitraeume schnell daran vorbei).
      # Andere Endpoints sind via nginx auf 5m global limitiert; nur /api/imports/xpeng/ ist auf 100m gehoben.
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ev_monitor}
    username: ${DB_USER:ev_user}
    password: ${DB_PASSWORD:ev_password}
    driver-class-name: org.postgresql.Driver

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=4h
    cache-names:
      - platformStats
      - modelsWithData
      - modelStats
      - topModels
      - efficientModels
      - longestRangeModels
      - leaderboard
      - brandModels
      - appUpdateCheck
      # Vergleichspreise der Heimlade-Ersparnis. Muessen hier stehen: cache-names ist eine
      # feste Liste, und ein @Cacheable auf einen nicht registrierten Namen wirft eine
      # IllegalArgumentException - die der GlobalExceptionHandler in ein 400 uebersetzt.
      - chargingRegionMedian
      - chargingCountryMedian
      - chargingPublicPriceByYear
      # nearbyCpos hat eine eigene Regel (30 Tage) in CpoRegistryConfig - der Registerbestand
      # der Bundesnetzagentur wird nur monatlich aktualisiert.

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET}
  expiration:
    ms: ${JWT_EXPIRATION_MS:2592000000}

# Live account the public demo ("App live testen") points at, read-only.
demo:
  account:
    username: ${DEMO_ACCOUNT_USERNAME:Ihle}

server:
  port: 8080
  forward-headers-strategy: NATIVE
  # Blue/Green-Deploy: laufende Requests beim Stoppen zu Ende bringen. Passt zu
  # stop_grace_period 35s in der Prod-Compose.
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    default-models-expand-depth: -1  # Models nicht auto-aufklappen
  default-flat-param-object: true

# Actuator Security (Default: DISABLED für Prod)
# In dev.yml wird health/info enabled
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      enabled: true
      show-details: never
  metrics:
    web:
      client:
        max-uri-tags: 500  # Höheres Limit für HTTP-Client-Metrics (Open-Meteo Backfill)

evmonitor:
  consumption:
    plausibility:
      absolute-min-kwh-per-100km: 10.0
      absolute-max-kwh-per-100km: 40.0
      wltp-lower-factor: 0.75
      wltp-upper-factor: 2.2
      sigma-multiplier: 2.5
      min-trips-for-statistical: 5
      min-trip-distance-km: 10
      ac-charging-efficiency: 0.90
      dc-charging-efficiency: 0.95

# VW EU-Data-Act-AutoSync: launch-verankertes Gratis-Fenster fuer alle. Launch = Deploy-Tag
# des Features (sonst haben Bestandsnutzer weniger Tage), Dauer noch offen (14 oder 30 Tage).
euda:
  autosync:
    trial:
      launch-date: ${EUDA_AUTOSYNC_TRIAL_LAUNCH_DATE:2026-09-21}
      days: ${EUDA_AUTOSYNC_TRIAL_DAYS:30}

# Pseudonymisierte Kopien von Hersteller-Uploads (VW, XPeng-CSV) als Testgrundlage, siehe docs/features/import-samples.md
import-samples:
  enabled: ${IMPORT_SAMPLES_ENABLED:true}
  retention: P180D
  max-bytes: 26214400  # 25 MB je Kopie, groessere werden nicht abgelegt

xpeng:
  import:
    # Tempdir for in-flight ZIP uploads. Files are deleted immediately after parsing
    # (or on crash recovery). On Hetzner prod: persistent disk path with enough space.
    # Local dev: defaults to /tmp.
    tempdir: ${XPENG_IMPORT_TEMPDIR:/tmp/ev-monitor-xpeng-imports}
    worker:
      poll-ms: ${XPENG_IMPORT_WORKER_POLL_MS:30000}  # Sicherheitsnetz; normal weckt das Queued-Event den Worker sofort
  # EU-Data-Act Open API (AutoSync via API-Pull). Enterprise-Credentials (appId/appSecret)
  # kommen aus der Entwickler-Registrierung und liegen NUR als Env-Var vor, nie im Repo.
  # appSecret geht ausschliesslich in die Request-Signatur ein, nie in den Request-Body.
  api:
    base-url: ${XPENG_API_BASE_URL:https://open.xpeng.com/open/oauth2/queryData}
    app-id: ${XPENG_API_APP_ID:}
    app-secret: ${XPENG_API_APP_SECRET:}
    enterprise-name: ${XPENG_API_ENTERPRISE_NAME:EVMonitor}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  # Native App (Capacitor) - min-native-version fuer GET /api/app/version,
  # steuert den "Im Store aktualisieren"-Hinweis (Web-Updates laufen ueber Capgo)
  min-native-version: ${APP_MIN_NATIVE_VERSION:1}
  # Capgo Live-Update Self-Hosting: Verzeichnis der Bundle-Zips + absolute Download-Basis-URL
  # bundle-base-url leer = aus dem Request abgeleitet (lokal/dev); in Prod auf https://ev-monitor.net/api/app/bundle setzen
  bundle-dir: ${APP_BUNDLE_DIR:/opt/ev-monitor/app-bundles}
  bundle-base-url: ${APP_BUNDLE_BASE_URL:}
  # Shared-Secret fuer POST /api/app/bundles (CI registriert ein Bundle). Leer = Endpoint deaktiviert.
  bundle-publish-token: ${APP_BUNDLE_PUBLISH_TOKEN:}
  mail:
    from: ${APP_MAIL_FROM:noreply@ev-monitor.net}
    # Antwortadresse persoenlicher Mails (Monatsrueckblick). Leer = Antworten gehen an from.
    personal-reply-to: ${APP_MAIL_PERSONAL_REPLY_TO:}
  monthly-recap:
    # Monatsrueckblick am 2. (Nachholer am 3.) um 10:00 Europe/Berlin. Aus, bis bewusst eingeschaltet.
    enabled: ${MONTHLY_RECAP_ENABLED:false}
  report:
    # Kommagetrennte interne Empfaenger des Wochenreports (Montag 17:00). Leer = aus.
    weekly-recipients: ${WEEKLY_REPORT_RECIPIENTS:}
  github:
    token: ${GITHUB_ISSUE_TOKEN:}
    repo: ${GITHUB_REPO:}
    issues:
      enabled: ${GITHUB_ISSUES_ENABLED:false}
  car-images:
    directory: ${CAR_IMAGES_DIR:/app/car-images}
  security:
    rate-limiting:
      enabled: ${RATE_LIMITING_ENABLED:true}  # Set to false to disable (emergency kill-switch)
  premium:
    enabled: ${PREMIUM_ENABLED:false}

# Sprit-Monitor API Integration
spritmonitor:
  application:
    id: ${SPRITMONITOR_APPLICATION_ID:190e3b1080a39777f369a4e9875df3d7}
  proxy:
    enabled: ${SPRITMONITOR_PROXY_ENABLED:false}
    host: ${SPRITMONITOR_PROXY_HOST:localhost}
    port: ${SPRITMONITOR_PROXY_PORT:1080}

# Tesla API Integration
tesla:
  encryption:
    key: ${TESLA_ENCRYPTION_KEY:change-this-32-char-secret-key!!}

# Internal Service Token (used by Wallbox Service to authenticate against Core)
internal:
  token: ${INTERNAL_SERVICE_TOKEN}

connectors:
  base-url: ${CONNECTORS_BASE_URL:http://connectors-service:8081}

# Wallbox-Service (DSGVO-Purge bei Kontolöschung)
wallbox:
  base-url: ${WALLBOX_BASE_URL:http://wallbox-service:8090}

# Tankerkoenig Fuel Price API (kostenloser Key auf creativecommons.tankerkoenig.de)
tankerkoenig:
  api-key: ${TANKERKOENIG_API_KEY:}

# openrouteservice (HeiGIT) - berechnet die Strassenverbindung fuer die Fahrten-Kachel.
# Standard-Plan ist kostenlos (2000 Anfragen/Tag, 40/Minute), Key auf account.heigit.org.
# Ohne Key bleibt die Funktion still abgeschaltet und die Kachel zeigt die Luftlinie.
openrouteservice:
  api-key: ${ORS_API_KEY:}

# Plausible Analytics
plausible:
  api-key: ${PLAUSIBLE_API_KEY:}
  site-id: ${PLAUSIBLE_SITE_ID:ev-monitor.net}

# Stripe Payment Integration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-id-monthly: ${STRIPE_PRICE_ID_MONTHLY:}
  price-id-yearly: ${STRIPE_PRICE_ID_YEARLY:}
  price-id-live-monthly: ${STRIPE_PRICE_ID_LIVE_MONTHLY:}
  price-id-live-yearly: ${STRIPE_PRICE_ID_LIVE_YEARLY:}
  price-id-monthly-intl: ${STRIPE_PRICE_ID_MONTHLY_INTL:}
  price-id-yearly-intl: ${STRIPE_PRICE_ID_YEARLY_INTL:}
  price-id-monthly-usd: ${STRIPE_PRICE_ID_MONTHLY_USD:}
  price-id-yearly-usd: ${STRIPE_PRICE_ID_YEARLY_USD:}
  price-id-monthly-gbp: ${STRIPE_PRICE_ID_MONTHLY_GBP:}
  price-id-yearly-gbp: ${STRIPE_PRICE_ID_YEARLY_GBP:}
  price-id-monthly-nok: ${STRIPE_PRICE_ID_MONTHLY_NOK:}
  price-id-yearly-nok: ${STRIPE_PRICE_ID_YEARLY_NOK:}
  price-id-monthly-sek: ${STRIPE_PRICE_ID_MONTHLY_SEK:}
  price-id-yearly-sek: ${STRIPE_PRICE_ID_YEARLY_SEK:}
  price-id-monthly-dkk: ${STRIPE_PRICE_ID_MONTHLY_DKK:}
  price-id-yearly-dkk: ${STRIPE_PRICE_ID_YEARLY_DKK:}
  referral-coupon-id: ${STRIPE_REFERRAL_COUPON_ID:}
  referral-reward-cents: ${STRIPE_REFERRAL_REWARD_CENTS:399}

# Mistral AI (La Plateforme, EU) fuer den Sprachlog. Ohne Key ist das Feature aus (503).
# Preise frieren beim Aufruf als voice_draft.cost_usd ein. Transcribe laut Mistral-Modellkarte,
# Voxtral-Small-Tokenpreise laut Drittquellen (03.10.2026) - gegen mistral.ai/pricing pruefen.
# Sprachlog fuer alle; VOICE_LOG_ADMIN_ONLY=true ist der Notschalter (nur Admins, sonst 404).
voice-log:
  admin-only: ${VOICE_LOG_ADMIN_ONLY:false}
  # Kostenalarm: Mail je ueberschrittener Stufe der voice_draft.cost_usd im laufenden Monat. Leer = aus.
  alert-email: ${VOICE_LOG_ALERT_EMAIL:sebastian.wien@ev-monitor.net}
  alert-step-usd: ${VOICE_LOG_ALERT_STEP_USD:10}

mistral:
  api-key: ${MISTRAL_API_KEY:}
  transcribe-model: ${MISTRAL_TRANSCRIBE_MODEL:voxtral-mini-latest}
  extract-model: ${MISTRAL_EXTRACT_MODEL:voxtral-small-latest}
  pricing:
    "[voxtral-mini-latest]":
      usd-per-audio-minute: 0.003
    "[voxtral-small-latest]":
      usd-per-million-input-tokens: 0.10
      usd-per-million-output-tokens: 0.30

# Ladesaeulenregister der Bundesnetzagentur (offener ArcGIS-Dienst, CC BY 4.0).
# Liefert die Vorauswahl der Ladenetze im Umkreis einer Ladung.
charging-station-registry:
  enabled: ${CHARGING_STATION_REGISTRY_ENABLED:true}
  radius-meters: ${CHARGING_STATION_REGISTRY_RADIUS_METERS:250}

logging:
  file:
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 500MB
