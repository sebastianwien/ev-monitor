cm:
  title: "Why is EV Monitor's consumption always higher than my trip computer?"
  intro: "EV Monitor often shows higher consumption than your trip computer. This is not a bug - it's a difference in what's being measured."
  s1_title: "Three measurement points, three different values"
  s1_desc: "Every kWh that moves your car passes through several stages. Each is measured differently - and all values are correct, they just answer different questions."
  grid_label: "Grid / Charging station"
  grid_desc: "What you pay for. Comes from the wallbox, charging station, or provider invoice."
  loss1: "~0.82 kWh charging loss (heat, AC-DC conversion)"
  battery_label: "Arrived in battery"
  battery_desc: "What the vehicle reports directly. Transmitted unmodified from vehicle APIs (e.g. via Smartcar) - EV Monitor removes charging losses for manually entered station values."
  battery_badge: "Basis for EV Monitor consumption calculation"
  loss2: "Standby consumption: climate, vehicle systems, software while parked (1-3 kWh/day)"
  bc_label: "Trip computer"
  bc_desc: "What the motor drew during the trip. Standby losses before and after the trip are <strong>not</strong> included."
  s2_title: "The critical gap: what EV Monitor cannot see"
  s2_desc: "Between charging end and trip start - and between trip end and the next charge - time passes. During this time, the SoC drops. EV Monitor has no access to the exact SoC value <em>at trip start</em>. Only the two measurement points at charging ends are known."
  charge_end: "Charge end"
  charge_start: "Charge start"
  trip_start: "Trip start"
  trip_end: "Trip end"
  known: "EV Monitor knows this value"
  unknown: "EV Monitor does <strong>not</strong> know this value"
  standby_loss: "Standby loss (duration unknown)"
  trip_segment: "Trip 236 km - what the trip computer sees"
  s2_info: "<strong>What this means:</strong> EV Monitor only sees the drop from 87% to 26% - 61 percentage points. Whether 57% is from driving and 4% from standby, or 59% driving and 2% standby, cannot be measured from the outside. But the total energy demand for this period is real - and EV Monitor captures it fully."
  s3_title: "How EV Monitor calculates"
  s3_desc: "EV Monitor captures the energy between two charging events - not just during the trip. This includes standby losses that are genuinely lost and show up in the next electricity bill."
  formula: "Consumption = (kWh charged + SoC correction) / distance × 100"
  soc_correction: "<strong>What is the SoC correction?</strong><br>You never charge from 0% to 100%. The correction accounts for the battery being fuller or emptier after this charge than after the previous one - so only the consumption of the actually driven distance is calculated, nothing more, nothing less."
  s4_title: "Why EV Monitor shows more than the trip computer"
  s4_desc: "This is not a bug. The trip computer only measures what the drivetrain needs during the trip. Energy consumed by the vehicle while parked does not appear on the trip computer, but is genuinely lost and needs to be recharged."
  per_day: "day"
  stat1_desc: "Average difference between real consumption and trip computer display according to independent research."
  stat2_desc: "Typical standby consumption of an EV while parked, depending on vehicle, temperature and software version."
  s5_title: "The unavoidable uncertainty"
  s5_intro: "No method is perfect - that's inherent to the nature of measurement:"
  bullet1: "<strong>SoC values</strong> are stored by EV Monitor as whole percentages. 1% corresponds to approx. 0.5-0.7 kWh depending on battery size - this is a measurable inaccuracy."
  bullet2: "<strong>kWh values from the vehicle</strong> are reported by the vehicle BMS or manufacturer API and forwarded unmodified by services like Smartcar. Precision depends on the vehicle manufacturer."
  bullet3: "<strong>Wallbox and charging station measurements</strong> have manufacturer-dependent measurement tolerances."
  bullet4: "<strong>Standby losses</strong> vary greatly by ambient temperature, software version, and usage behavior."
  s5_footer: "EV Monitor uses the median over multiple charging sessions to smooth out outliers, and marks individual trips with a plausibility indicator when the calculated value appears unusual."
  sources_title: "Sources"

