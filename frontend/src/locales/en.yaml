consumption_info:
  trigger: "How is your consumption calculated?"
  p1: "Consumption is calculated from <strong>charged kWh</strong>, <strong>state of charge (SoC)</strong> and <strong>odometer</strong> of two consecutive charging sessions - all three values must be present in both entries. If one is missing, consumption for the next entry cannot be calculated."
  p2_pre: "After <strong>{minTrips} evaluable trips</strong>, we compare each value against your personal average. Before that, your vehicle's WLTP reference value is used. Sessions with strongly deviating consumption are"
  p2_post: "flagged - usually a sign that a charging session is missing between two entries."
  p4: "<strong>Battery health (SoH):</strong> This indicates how much your battery has aged over the years and consequently lost capacity. With AutoSync, EV Monitor reads the actual charged kWh directly from the vehicle and compares them to the expected capacity based on the state of charge (SoC). Once 5 evaluable sessions with at least 30% delta in the charging session are available, the median is calculated - filtering out outliers. You can also enter the net amount yourself on any charging session using the optional <strong>\"kWh (vehicle)\"</strong> field - this triggers the same calculation."
  methodology_link: "Why is EV Monitor higher than my trip computer?"
  p3: "<strong>Charging losses - context-dependent:</strong> Wallboxes and charging stations measure what flows at the socket - including charging losses (heat generated during charging, approx. 5-10%). For <strong>consumption (kWh/100km)</strong>, these losses are removed (AC 5 to 13% depending on charging power, DC 5%) so the value reflects your actual driving efficiency and is comparable to WLTP. For <strong>costs (€/kWh)</strong>, they stay in - you paid for them after all."
  p5_distance_estimate: "<strong>Distance without trips (estimate):</strong> If you don't record trips (e.g. charge-only import or upload via API), we derive the distance driven from your charges' odometer readings. Only what clearly falls within the period is counted - the distance between two charges in the same period. Whatever was driven between the previous charge and the first one in the period can't be attributed cleanly without trips and is left out. Such values are marked with <strong>~</strong>."

