  vin_hint: "17 characters, found on your registration document or in the XPeng app."
  consent_show_full: "Show full consent text"
  consent_full_text: |
    I consent, pursuant to Art. 6(1)(a) GDPR, to the processing by Sebastian Wien, Berlin, Germany (operator of the "EV Monitor" service, https://ev-monitor.net - full address in the imprint) of the telematics data of my XPeng vehicle (identified by the VIN above) which I myself request from XPeng under the EU Data Act (Regulation (EU) 2023/2854) and upload to EV Monitor.

    Processing comprises: decryption of the file, extraction of relevant telematics signals, aggregation into trips and charging sessions, display in my personal EV Monitor account, and storage of these aggregates. The uploaded Excel file itself is deleted after processing.

    Processing is carried out solely for the purpose of trip and charging analysis of my vehicle. No data is shared with third parties.

    I may revoke this consent at any time without giving reasons by removing the connection in EV Monitor. Aggregates already imported (trips, charging sessions) remain in my account until I delete them manually. Revocation does not affect the lawfulness of processing carried out before the revocation.

    Note: In this phase (manual upload), data is requested from XPeng by me personally via email. Should EV Monitor take over this step on my behalf in the future, I will be asked for a separate authorization specific to that purpose pursuant to Art. 5 EU Data Act.
