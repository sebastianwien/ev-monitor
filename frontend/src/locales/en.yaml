  autosync_prompt_success_body: "We are sending the first request to XPeng and will add your trips and charges as soon as the reply arrives. You are copied on every request."
  step_consent_title: "Allow data processing"
  step_request_title: "Request data from XPeng"
  step_request_body: "Open your mail client. The request is pre-filled, just send it. XPeng will respond within 5-10 days with an encrypted Excel file."
  step_upload_title: "Upload export"
  upload_howto: "Request your EU Data Act export in the XPeng portal and upload the downloaded ZIP file here. We detect the VIN automatically and link it to your car."
