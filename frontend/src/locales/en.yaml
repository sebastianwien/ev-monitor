announcements:
  consumption_methodology_v1_title: "Why is my consumption higher than my trip computer?"
  consumption_methodology_v1_body: "We have explained this in detail - with real numbers, the full energy chain from the grid to the motor, and the reason why both values are correct."
  consumption_methodology_v1_cta: "Learn more"
  charging_provider_v1_title: "New: Charging provider & public charging"
  charging_provider_v1_body: "You can now indicate whether you charged at a public station and which network operator (CPO) was behind it. Add your charging tariff (EMP) under Settings → Charging provider. The log entry form has also been simplified - only kWh and price are required."
  charging_provider_v1_cta: "Go to settings"
  charging_cards_portfolio_v1_title: "New: Manage multiple charging cards"
  charging_cards_portfolio_v1_body: "You can now store any number of charging cards and tariffs - EnBW, Maingau, Fastned and more at the same time. When logging a session, tap to select the right card, and the last tariff used at the same location is suggested automatically."
  charging_cards_portfolio_v1_cta: "Manage charging cards"
  battery_soh_heatpump_v1_title: "Track battery health & heat pump"
  battery_soh_heatpump_v1_body: "You can now record your battery's State of Health (SoH) with a date. Consumption calculations for older charging sessions are automatically adjusted - a 5-year-old car had more battery capacity back then. There's also a new heat pump flag that helps with plausibility checks for winter consumption values."
  battery_soh_heatpump_v1_cta: "Go to vehicle"
  survey_premium_april_2026_title: "Quick question - 60 seconds"
  survey_premium_april_2026_body: "I'm planning a premium feature for automatic charge tracking. Connect your car once and sessions come in automatically. What do you think?"
  survey_premium_april_2026_cta: "To the survey"
  price_suggestion_v1_title: "Price suggestion when logging"
  price_suggestion_v1_body: "The price per kWh is now automatically pre-filled - based on the last charging session at the same location. This works both at home and at public chargers. To make this possible, location accuracy has been increased: public chargers are localised to ~150m, private sessions to ~600m. Exact GPS coordinates are still never stored."
  consumption_normalization_v1_title: "More accurate consumption: charging losses removed"
  consumption_normalization_v1_body: "Your displayed consumption (kWh/100km) now reflects true driving consumption from the battery. Wallbox measurements include charging losses from the charging process itself - these are now automatically removed (AC charging: 10%, DC fast charging: 5%). Your consumption values will decrease slightly and are now better comparable with WLTP and other data sources. Cost calculations are not affected."
  goe_statistics_fix_v1_title: "go-eCharger: Statistics fix"
  goe_statistics_fix_v1_body: "Your go-eCharger sessions are now correctly counted in statistics - including kWh, costs and consumption calculations."
  soh_autodetect_v1_title: "Battery health is now detected automatically"
  soh_autodetect_v1_body: "If you use AutoSync, EV Monitor now automatically detects your battery state of health (SoH) from your charging sessions - no manual entry needed. For manual sessions, you can enter 'kWh (vehicle)' when logging a charge to trigger the same calculation. For details on how it works, see the 'How is your consumption calculated?' info box in the dashboard or vehicle management."
  soh_autodetect_v1_cta: "View vehicle"
  car_reassignment_v1_title: "Reassign sessions to a different vehicle"
  car_reassignment_v1_body: "Assigned a session to the wrong car? No problem - in the dashboard you can reassign any session (or an entire group) to a different vehicle with one click."
  autosync_premium_v1_title: "New: EV Monitor AutoSync"
  autosync_premium_v1_body: "Connect your car once and all charging sessions are automatically imported into EV Monitor - no manual entry needed. Now available as a pro feature. 28 brands supported - including BMW, VW, Mercedes, Audi, Tesla, Hyundai, Volvo, Polestar and many more."
  autosync_premium_v1_cta: "Learn more"
  kwh_primary_formula_v1_title: "More accurate consumption calculation"
  kwh_primary_formula_v1_body: "Consumption used to be calculated from SoC percentages × nominal capacity. The BMS calibrates its percentage display to the current battery capacity though - for batteries with degradation this deviated from the nominal capacity and resulted in slightly inflated values. Now the calculation uses measured kilowatt-hours directly, plus a small SoC-level correction between sessions. For older batteries the difference can be up to 2 kWh/100km. All values have been updated automatically.<br><br>I've also written a detailed explanation of why EV Monitor often reads higher than your trip computer - with real numbers and the full energy chain from the grid to the motor."
  spritmonitor_raw_refresh_v1_title: "SpritMonitor: Re-import raw data"
  spritmonitor_raw_refresh_v1_body: "The SpritMonitor import now has a new button 'Re-import raw data'. It re-fetches the original JSON from Sprit-Monitor and updates it, without overwriting your manually corrected values (kWh, odometer, etc.). This allows me to retroactively correct and improve charging sessions, as the SpritMonitor data format is not fully documented."
  net_capacity_v1_title: "Vehicle database updated"
  net_capacity_v1_body: "The vehicle database has been updated. Net battery capacity values have been corrected for some variants. Consumption figures may have changed slightly as a result."
  brutto_netto_v1_title: "Improved consumption and cost calculation"
  brutto_netto_v1_body: "EV Monitor now more consistently uses both net and gross energy values from logged charging sessions in all calculations. This may cause slight adjustments to consumption, cost, and range figures - they now reflect reality even more accurately!"
  autosync_live_launch_v1_title: "Thanks to all beta testers"
  autosync_live_launch_v1_body: "Your trip data over the past weeks showed me what works. For Tesla and Polestar the data quality is good enough for reliable live trip detection. For every other brand it's currently either too coarse, too irregular - or I simply don't have enough data yet to make an honest call.\n\nFor that reason trip detection becomes part of AutoSync Live from today - currently +€1/month on top of AutoSync. The feature is limited to Tesla and Polestar for now. As soon as I see sufficient data of comparable quality from another brand, I'll switch it on for them too."
  autosync_live_launch_v1_cta: "Upgrade to AutoSync Live"
  tesla_telemetry_rollout_v1_title: "Tesla Live-Sync now runs via Telemetry"
  tesla_telemetry_rollout_v1_body: "Tesla drivers, heads up: I switched Live-Sync from polling to push-based Telemetry. Your car no longer has to wake up for every check, charging sessions arrive in real time. To keep it working, you need to re-pair the connection once - takes less than 2 minutes and uses the Virtual Key in the Tesla app."
  tesla_telemetry_rollout_v1_cta: "Set up connection"
  negative_prices_v1_title: "Negative electricity prices now supported"
  negative_prices_v1_body: "With dynamic electricity tariffs, the price per kWh can drop below zero. You can now enter negative prices when logging a charging session - both in the app and via API."
  fixed_costs_dashboard_v1_title: "Fixed costs now in the dashboard"
  fixed_costs_dashboard_v1_body: "Insurance, tax, maintenance and more can now be tracked under fixed costs. The dashboard shows your total car costs - split by energy and fixed costs. The new cost history chart gives you a 12-month overview at a glance."
  fixed_costs_dashboard_v1_cta: "Add fixed costs"
  feature_survey_v1_title: "Which features would you like to see?"
  feature_survey_v1_body: "Help me shape the future of ev-monitor! Vote on which features should come next in this short survey."
  feature_survey_v1_cta: "Take the survey"
  spec_charging_efficiency_v1_title: "More accurate consumption thanks to model-specific charging losses"
  spec_charging_efficiency_v1_body: "Charging losses are now calculated per vehicle model - derived from real charging sessions in the community. Instead of flat 5% (DC) or 10% (AC), measured values per vehicle model are now used in your consumption statistics. The more data the community provides, the more precise the calculation."
  spec_charging_efficiency_v1_cta: "Learn more"

