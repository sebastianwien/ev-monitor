  empty_hub_too_small: "A charge that fills the battery by at least {required} percentage points is required, for example from 10% to 90%. The largest charge so far was {largest} percentage points. Smaller charges produce values that are too imprecise."
  empty_too_few_charges: "A reliable value needs {required} suitable charges, {current} are on record so far. Single measurements vary too much to be shown as a percentage."
