  method_title: "How this value is determined"
  method_bms: "Some vehicles report their energy content directly. That value is read out and compared against the rated capacity - the most accurate source available."
  method_estimate: "Otherwise the calculation runs backwards: how much energy went in during a charge, and how far did the state of charge rise? That gives today's capacity. Extrapolating only works for large charges, which is why {required} percentage points is the minimum: going from 10 to 20 percent stores a different amount of energy than going from 80 to 90 percent. Inferring the whole battery from a small slice would be off - the larger the charge, the less that matters."
  method_median: "The middle value of the last five suitable charges is used, with larger charges counting more. That way a single outlier cannot take over."
  disclaimer: "All values are approximations and are no substitute for a battery diagnosis at a workshop. Temperature, charging power and the vehicle's own calibration affect every single reading."
