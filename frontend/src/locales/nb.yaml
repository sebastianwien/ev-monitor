  consent_full_text_v2: |
    Jeg gir Sebastian Wien, Berlin, Tyskland (driver av «EV Monitor»-tjenesten, https://ev-monitor.net) fullmakt som autorisert datamottaker i henhold til art. 5 i forordning (EU) 2023/2854 (EU Data Act):

    1. Å automatisk sende en dataforespørsel etter art. 4 EU Data Act til XPeng (data-privacy{'@'}xiaopeng.com) hver 14. dag på mine vegne, med meg inkludert som kopi.
    2. Å motta, dekryptere og behandle svar-e-poster fra XPeng med mine telematikkdata (Excel-vedlegg), inkludert aggregering til turer og ladeøkter og lagring i kontoen min. Excel-filen slettes etter behandling.

    Data vil ikke deles med tredjeparter.

    Jeg kan tilbakekalle denne fullmakten når som helst ved å slette AutoSync-tilkoblingen i EV Monitor. Allerede importerte data beholdes til manuell sletting.
  mail_body: |
