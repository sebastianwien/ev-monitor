xpeng:
  eyebrow_brand: "XPeng · EU Data Act"
  eyebrow_step1: "Send forespørsel"
  eyebrow_step2: "Last opp"
  intro_title: "XPeng EU Data Act-import"
  intro_body: "Siden XPeng (ennå) ikke tilbyr et API, importerer du telematikkdata via Excel: be om den fra XPeng på e-post, motta den innen 5-10 dager, og last den opp her."
  no_xpeng_cars: "Ingen XPeng-kjøretøy i garasjen din."
  autosync_intro_eyebrow: "XPeng AutoSync"
  autosync_intro_title: "XPeng-dataene dine kommer av seg selv"
  autosync_intro_no_api: "For XPeng finnes det ennå ingen offisiell grensesnitt som lar apper hente kjøretøydataene. Å lese dem direkte fra bilen er derfor foreløpig ikke mulig."
  autosync_intro_data_act: "Men det finnes EU Data Act - en europeisk forordning som slår fast at dataene fra kjøretøyet ditt tilhører deg. Du kan be produsenten om dem og får dem tilsendt på e-post som et Excel-ark. Det er denne veien vi bruker for deg."
  autosync_intro_steps_title: "Hva som skjer videre"
  autosync_intro_step1: "Du gir oss én gang lov til å spørre XPeng på dine vegne, og oppgir hvilken e-postadresse du har registrert hos XPeng."
  autosync_intro_step2: "Vi skriver til XPengs personvernavdeling - juridisk korrekt formulert, du trenger ikke gjøre noe. Du står i kopi på hver forespørsel og ser hva som skjer i ditt navn."
  autosync_intro_step3: "Etter noen dager svarer XPeng med et Excel-ark. Det er passordbeskyttet og går rett til vår innboks."
  autosync_intro_step4: "Vi åpner arket automatisk, henter ut ladingene og turene dine og legger dem inn i loggboken. Ingenting å laste opp, ingenting å taste inn."
  autosync_intro_step5: "Hver 14. dag spør vi på nytt, slik at de nye turene dine kommer inn. Fra nå av går det av seg selv."
  autosync_intro_manual_hint: "Vil du heller sende forespørselen til XPeng selv og laste opp Excel-filen manuelt?"
  autosync_intro_manual_link: "Gå til manuell XPeng-import"
  autosync_prompt_eyebrow: "Bil lagt til"
  autosync_prompt_title: "Vil du sette opp AutoSync for XPeng-en din?"
  autosync_prompt_later: "Sett opp senere"
  autosync_prompt_later_hint: "Du finner AutoSync under Import når som helst."
  autosync_prompt_success_title: "AutoSync er satt opp"
  autosync_prompt_success_body: "Vi sender den første forespørselen til XPeng og legger inn turene og ladingene dine så snart svaret kommer. Du står i kopi på hver forespørsel."
  step_consent_title: "Tillat databehandling"
  step_request_title: "Be om data fra XPeng"
  step_request_body: "Åpne e-postklienten. Forespørselen er forhåndsutfylt, du må bare sende den. XPeng svarer innen 5-10 dager med en kryptert Excel-fil."
  step_upload_title: "Last opp Excel"
  car_label: "Kjøretøy"
  vin_label: "Kjøretøyets identifikasjonsnummer (VIN)"
  vin_hint: "17 tegn, finnes i vognkortet eller i XPeng-appen."
  consent_show_full: "Vis full samtykketekst"
  consent_full_text: |
    Jeg samtykker, i henhold til art. 6 nr. 1 bokstav a GDPR, til at Sebastian Wien, Berlin, Tyskland (operatør av tjenesten "EV Monitor", https://ev-monitor.net - fullstendig adresse i nettsidens imprint) behandler telematikkdata for mitt XPeng-kjøretøy (identifisert med VIN-en oppgitt over) som jeg selv ber om fra XPeng i henhold til EU Data Act (Forordning (EU) 2023/2854) og laster opp i EV Monitor.

    Behandlingen omfatter: dekryptering av filen, uthenting av relevante telematikksignaler, aggregering til turer og ladeøkter, visning på min personlige EV Monitor-konto samt lagring av disse aggregatene. Den opplastede Excel-filen slettes etter behandling.

    Behandlingen skjer utelukkende for å analysere turer og lading av kjøretøyet mitt. Data deles ikke med tredjeparter.

    Jeg kan tilbakekalle samtykket når som helst uten begrunnelse ved å fjerne tilkoblingen i EV Monitor. Aggregater som allerede er importert (turer, ladeøkter), forblir på kontoen min til jeg sletter dem manuelt. Tilbakekallet påvirker ikke lovligheten av behandlingen frem til tilbakekallstidspunktet.

    Merk: I denne fasen (manuell opplasting) ber jeg selv XPeng om dataene via e-post. Skulle EV Monitor i fremtiden overta dette steget på mine vegne, vil jeg på forhånd bli bedt om en egen, spesifikk fullmakt etter art. 5 EU Data Act.
  consent_accept_label: "Jeg samtykker til behandlingen av de opplastede dataene som beskrevet ovenfor."
