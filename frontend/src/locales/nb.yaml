  info_auto: "Etter en engangsoppsett kjører alt <strong>helt automatisk</strong>: EV Monitor sjekker go-e Cloud med noen minutters mellomrom for å se om det pågår lading."
  info_session: Så snart du kobler til kabelen, registrerer systemet starttidspunktet og strømforbruket. Når du er ferdig, opprettes det automatisk en <strong>ladingsoppføring</strong> i oversikten din – med dato, kWh og eventuelt kostnader.
