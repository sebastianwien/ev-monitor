  consent_full_text_v2: |
    Ich beauftrage Sebastian Wien, Berlin, Deutschland (Betreiber des Dienstes "EV Monitor", https://ev-monitor.net - vollständige Anschrift im Impressum), gemäß Art. 5 der Verordnung (EU) 2023/2854 (EU Data Act) als bevollmächtigten Datenempfänger:

    1. In meinem Namen automatisch alle 14 Tage eine Datenanforderung nach Art. 4 EU Data Act per E-Mail an XPeng (data-privacy{'@'}xiaopeng.com) zu senden, wobei ich per CC eingebunden werde.
    2. Eingehende Antwort-E-Mails von XPeng mit meinen Telematik-Daten (Excel-Anhang) zu empfangen, zu entschlüsseln und zu verarbeiten (Aggregation zu Fahrten und Ladevorgängen, Speicherung in meinem Account). Die Excel-Datei wird nach der Verarbeitung gelöscht.

    Eine Weitergabe der Daten an Dritte findet nicht statt.

    Ich kann diese Vollmacht jederzeit ohne Angabe von Gründen widerrufen, indem ich die AutoSync-Verbindung in EV Monitor lösche. Bereits importierte Daten bleiben bis zu manueller Löschung erhalten. Der Widerruf berührt nicht die Rechtmäßigkeit der bis dahin erfolgten Verarbeitung.
