consumption_info:
  trigger: "Wie wird dein Verbrauch berechnet?"
  p1: "Der Verbrauch wird aus <strong>geladenen kWh</strong>, <strong>Ladezustand (SoC)</strong> und <strong>Kilometerstand</strong> zweier aufeinanderfolgender Ladevorgänge berechnet - alle drei Angaben müssen bei beiden Einträgen vorhanden sein. Fehlt eine davon, kann der Verbrauch für den nächsten Eintrag nicht berechnet werden."
  p2_pre: "Ab <strong>{minTrips} auswertbaren Fahrten</strong> vergleichen wir jeden Wert mit deinem persönlichen Durchschnitt. Davor wird der WLTP-Richtwert deines Fahrzeugs als Referenz genutzt. Ladevorgänge mit stark abweichendem Verbrauch werden mit"
  p2_post: "markiert - meist ein Zeichen, dass zwischen zwei Einträgen ein Ladevorgang fehlt."
  p4: "<strong>Akku-Gesundheit (SoH):</strong> Diese gibt an, wie stark dein Akku über die Jahre gealtert ist und somit an Kapazität verloren hat. Mit AutoSync liest EV Monitor die tatsächlich geladenen kWh direkt vom Fahrzeug und vergleicht sie mit der erwarteten Kapazität auf Basis des Ladezustands (SoC). Ab 5 auswertbaren Ladevorgängen mit mindestens 30% Delta im Ladevorgang wird der Median gebildet - das filtert Ausreißer heraus. Du kannst den Nettobetrag auch selbst bei Ladevorgängen unter dem optionalen Feld <strong>\"kWh laut Fahrzeug\"</strong> nachtragen - das löst dieselbe Berechnung aus."
  methodology_link: "Warum liegt EV Monitor über meinem Bordcomputer?"
  p3: "<strong>Ladeverluste - je nach Kontext:</strong> Wallboxen und Ladesäulen messen was an der Steckdose fließt - inklusive Ladeverlusten (Wärme die beim Laden entsteht, ca. 5-10%). Für den <strong>Verbrauch (kWh/100km)</strong> werden diese Verluste herausgerechnet (AC: 10%, DC: 5%), damit der Wert dem echten Fahrverbrauch entspricht und mit WLTP vergleichbar ist. Für die <strong>Kosten (€/kWh)</strong> bleiben sie drin - du hast sie schließlich bezahlt."

