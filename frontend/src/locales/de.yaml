  title: "Werde Supporter"
  lead: "EV Monitor gehört keinem Konzern - nur den Menschen, die es nutzen. Wenn dir das gefällt, kannst du helfen, es so zu halten."
  story_p1: "EV Monitor ist als Hobbyprojekt entstanden: ich wollte eine moderne Lösung für ein Ladelogbuch erstellen, welches mir hilft, meine Kosten und Verbräuche im Blick zu behalten. Mit Hilfe der Community soll außerdem eine Datengrundlage etabliert werden, welche anderen hilft, eine Kaufentscheidung zu treffen."
  story_p2: "Der gesamte Code ist Open Source. Keine Werbung, kein Datenhandel, keine Investoren, die Wachstum um jeden Preis wollen. Das heisst aber auch: EV Monitor trägt sich nur durch die Menschen, die es freiwillig unterstützen."
  story_p3: "Dein Beitrag hält die Server am Laufen und gibt mir die Zeit, weiter daran zu bauen. Als Dankeschön gibt es weitere Insights zu deinen Daten."
