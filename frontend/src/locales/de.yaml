  smartcar_how_title: "Wie funktioniert AutoSync?"
  smartcar_how_q1: "Was ist Smartcar?"
  smartcar_how_a1: "AutoSync nutzt im Hintergrund einen Dienst namens Smartcar - eine offizielle Schnittstelle, über die Fahrzeughersteller Apps autorisiert Zugriff auf Fahrzeugdaten gewähren. Über 30 Hersteller haben Smartcar offiziell freigegeben, darunter BMW, Volkswagen, Mercedes und Volvo."
  smartcar_how_q2: "Warum über einen Mittelsmann?"
  smartcar_how_a2: "Kein Hersteller gibt Dritten direkt Zugriff auf Fahrzeugdaten. Smartcar ist der genehmigte Weg - sie haben offizielle Partnerschaften mit den Herstellern und dürfen im Auftrag des Fahrzeugbesitzers auf die Daten zugreifen. EV Monitor hat keine eigene Verbindung zu deinem Auto - das läuft alles über Smartcar."
  smartcar_how_q3: "Was passiert beim Verbinden?"
  smartcar_how_a3: "Du wirst zur Login-Seite deines Herstellers weitergeleitet - direkt zu BMW, Volkswagen, Mercedes etc. Dort gibst du deine Zugangsdaten ein, und nur dein Hersteller sieht sie. Weder Smartcar noch EV Monitor sehen dein Passwort je. Der Hersteller gibt Smartcar danach nur einen temporären Zugriffsschlüssel - das funktioniert genau wie 'Mit Google einloggen': du gibst dein Passwort Google, nicht dem Dienst der Google nutzt. Du kannst den Zugriff jederzeit direkt beim Hersteller oder hier widerrufen."
  smartcar_how_q4: "Was passiert beim Laden?"
  smartcar_how_a4: "Sobald eine Ladesession beginnt und endet, schickt Smartcar die Daten automatisch an EV Monitor. Die kWh kommen direkt vom Fahrzeug - genauer als jede Schätzung. Du musst gar nichts tun."
  smartcar_how_q5: "Muss ich danach noch etwas tun?"
  smartcar_how_a5: "Nein. Einmal verbunden, läuft alles vollständig im Hintergrund."
  tesla_how_title: "Wie funktioniert AutoSync für Tesla?"
  tesla_how_a1: "AutoSync nutzt für Tesla die offizielle <strong>Tesla Fleet Telemetry</strong> - das ist Teslas eigene Schnittstelle, über die das Fahrzeug Lade- und Statusdaten direkt an autorisierte Apps streamt. Kein Drittanbieter, kein Polling - die Daten kommen alle paar Sekunden direkt aus dem Auto."
  tesla_how_q2: "Warum Tesla anders als andere Marken?"
  tesla_how_a2: "Tesla bietet als einziger Hersteller einen offiziellen Push-Stream an - das Fahrzeug schickt aktiv Daten, sobald sich etwas ändert. Andere Marken erlauben nur regelmäßige Abfragen über Drittanbieter wie Smartcar. Für dich heißt das: schnellere Erkennung von Lade-Start und -Ende und kein API-Limit."
  tesla_how_q3: "Was passiert beim Verbinden?"
  tesla_how_a3: "Du wirst zur Tesla-Login-Seite weitergeleitet und meldest dich mit deinem Tesla-Account an. Tesla zeigt dir genau, welche Daten EV Monitor bekommt, und du autorisierst den Zugriff. Anschließend pairst du EV Monitor einmalig in der Tesla-App als virtuellen Schlüssel. Tesla sieht dein Passwort, EV Monitor nicht. Den Zugriff kannst du jederzeit in der Tesla-App oder hier wieder entziehen."
  tesla_how_q4: "Was passiert beim Laden?"
  tesla_how_a4: "Sobald dein Tesla einsteckt und zu laden beginnt, schickt das Fahrzeug die Telemetry direkt an EV Monitor. Wir erkennen Start, Ende und die exakt geladenen kWh - egal ob am Supercharger, an deiner Wallbox oder an einer öffentlichen Säule. Der Ladevorgang erscheint automatisch im Logbuch."
  tesla_how_q5: "Muss ich danach noch etwas tun?"
  tesla_how_a5: "Nein. Einmal gepairt läuft alles vollständig im Hintergrund - auch über Software-Updates am Fahrzeug hinweg."
