announcements:
  tesla_telemetry_recovery_v1_title: "Tesla-Telemetrie: Ausfall behoben"
  tesla_telemetry_recovery_v1_body: "Zwischen dem 10. und 16. Juli konnten manche Tesla-Fahrzeuge keine neuen Lade- und Fahrtdaten mehr senden. Ursache war ein Zertifikatsproblem auf meinem Telemetrie-Server, nicht deine Kopplung. Das ist behoben und so abgesichert, dass es nicht wiederkehrt. Deine Telemetrie läuft automatisch wieder an, sobald dein Auto das nächste Mal online ist oder du fährst - du musst nichts tun. Falls danach weiterhin keine neuen Vorgänge erscheinen, melde dich kurz bei mir."
  tesla_location_reconnect_v1_title: "Tesla neu verbinden - für automatische Ladepreise"
  tesla_location_reconnect_v1_body: "Tesla verlangt seit einer Änderung an der Schnittstelle eine eigene Freigabe für Standortdaten. Sie lässt sich nur beim Verbinden erteilen, deshalb die Bitte: verbinde deinen Tesla einmal neu. Danach erkennt ev-monitor wieder, wo du geladen hast - zu Hause, am Supercharger oder unterwegs - und trägt den passenden Preis automatisch ein."
  tesla_location_reconnect_v1_cta: "Tesla neu verbinden"
  survey_ev_pain_points_2026_title: "Kurze Umfrage: Was nervt dich beim Laden?"
  survey_ev_pain_points_2026_body: "Fünf offene Fragen zu deinen Pain Points beim Laden - und was dir bei EV Monitor noch fehlt. Dauert 2 Minuten und fließt direkt in die Roadmap ein."
  survey_ev_pain_points_2026_cta: "Zur Umfrage"
  consumption_methodology_v1_title: "Warum liegt mein Verbrauch über dem Bordcomputer?"
  consumption_methodology_v1_body: "Das haben wir jetzt ausführlich erklärt - mit echten Zahlen, der vollen Energiekette vom Stromnetz bis zum Motor, und dem Grund warum beide Werte korrekt sind."
  consumption_methodology_v1_cta: "Mehr erfahren"
  charging_provider_v1_title: "Neu: Ladeanbieter & öffentliches Laden"
  charging_provider_v1_body: "Ab sofort kannst du bei jedem Ladevorgang angeben, ob du an einer öffentlichen Säule geladen hast und welcher Netzbetreiber (CPO) dahinter steckt. Deinen Ladetarif (EMP) hinterlegst du unter Einstellungen → Ladeanbieter. Das Erfassungsformular wurde außerdem vereinfacht - nur noch kWh und Preis sind Pflichtfelder."
  charging_provider_v1_cta: "Zu den Einstellungen"
  charging_cards_portfolio_v1_title: "Neu: Mehrere Ladekarten verwalten"
  charging_cards_portfolio_v1_body: "Du kannst jetzt beliebig viele Ladekarten und -tarife hinterlegen - EnBW, Maingau, Fastned und mehr gleichzeitig. Beim Erfassen wählst du per Tipp die passende Karte aus, und der letzte verwendete Tarif am selben Standort wird automatisch vorgeschlagen."
  charging_cards_portfolio_v1_cta: "Ladekarten verwalten"
  battery_soh_heatpump_v1_title: "Batterie-Gesundheit & Wärmepumpe erfassen"
  battery_soh_heatpump_v1_body: "Ihr könnt jetzt den Batteriezustand (SoH) eures Fahrzeugs mit Datum hinterlegen. Verbrauchsberechnungen für ältere Ladevorgänge werden damit automatisch angepasst - ein 5 Jahre altes Auto hatte eben damals noch mehr Akkukapazität. Außerdem gibt es jetzt ein Wärmepumpen-Flag, das bei der Plausibilitätsprüfung von Winterverbräuchen hilft."
  battery_soh_heatpump_v1_cta: "Zum Fahrzeug"
  survey_premium_april_2026_title: "Kurze Frage - 60 Sekunden"
  survey_premium_april_2026_body: "Ich plane ein Premium-Feature für das vollautomatische Erfassen von Ladevorgängen. Dein Auto verbindet sich einmalig und Ladesessions kommen von selbst. Was hältst du davon?"
  survey_premium_april_2026_cta: "Zur Umfrage"
  price_suggestion_v1_title: "Preisvorschlag beim Erfassen"
  price_suggestion_v1_body: "Der Preis pro kWh wird jetzt automatisch vorausgefüllt - basierend auf dem letzten Ladevorgang am gleichen Standort. Das funktioniert sowohl zuhause als auch an öffentlichen Säulen. Dafür wurde die Genauigkeit der Standorterfassung erhöht: öffentliche Ladesäulen werden auf ~150m lokalisiert, private Ladevorgänge auf ~600m. Exakte GPS-Koordinaten werden weiterhin nie gespeichert."
  consumption_normalization_v1_title: "Genauere Verbrauchswerte: Ladeverluste herausgerechnet"
  consumption_normalization_v1_body: "Dein angezeigter Verbrauch (kWh/100km) entspricht jetzt dem echten Fahrverbrauch aus dem Akku. Wallbox-Messungen enthalten Ladeverluste durch den Ladevorgang selbst - diese werden jetzt automatisch herausgerechnet (AC-Laden: 10%, DC-Schnellladen: 5%). Deine Verbrauchswerte sinken dadurch leicht und sind jetzt besser mit WLTP und anderen Datenquellen vergleichbar. Die Kostenkalkulation bleibt davon unberührt."
  goe_statistics_fix_v1_title: "go-eCharger: Statistik-Fix"
  goe_statistics_fix_v1_body: "Deine go-eCharger-Ladevorgänge werden jetzt korrekt in der Statistik gezählt - kWh, Kosten und Verbrauchsberechnung inklusive."
  soh_autodetect_v1_title: "Akku-Gesundheit wird automatisch erkannt"
  soh_autodetect_v1_body: "Wenn du AutoSync nutzt, erkennt EV Monitor deinen Akkuzustand (SoH) jetzt automatisch aus deinen Ladevorgängen - kein manuelles Eintragen mehr nötig. Für manuelle Ladevorgänge kannst du beim Erfassen 'kWh laut Fahrzeug' eingeben und damit dieselbe Berechnung auslösen. Wie genau das funktioniert, erklärt die Infobox 'Wie wird dein Verbrauch ermittelt?' im Dashboard und in der Fahrzeugverwaltung."
  soh_autodetect_v1_cta: "Zum Fahrzeug"
  car_reassignment_v1_title: "Fahrzeug nachträglich ändern"
  car_reassignment_v1_body: "Ladevorgang dem falschen Auto zugeordnet? Kein Problem - im Dashboard kannst du jeden Ladevorgang (oder eine ganze Ladegruppe) mit einem Klick einem anderen Fahrzeug zuordnen."
  autosync_premium_v1_title: "Neu: EV Monitor AutoSync"
  autosync_premium_v1_body: "Verbinde dein Auto einmalig und alle Ladevorgänge werden automatisch in EV Monitor importiert - ganz ohne manuelle Eingabe. Jetzt als Pro-Feature verfügbar. 28 Marken werden unterstützt - darunter BMW, VW, Mercedes, Audi, Tesla, Hyundai, Volvo, Polestar und viele mehr."
  autosync_premium_v1_cta: "Mehr erfahren"
  kwh_primary_formula_v1_title: "Präzisere Verbrauchsberechnung"
  kwh_primary_formula_v1_body: "Bisher wurde der Verbrauch über SoC-Prozente × Nennkapazität berechnet. Das BMS kalibriert seine Prozentanzeige aber auf die aktuelle Batteriekapazität - bei Akkus mit Degradation wich das von der Nennkapazität ab und ergab leicht überhöhte Werte. Jetzt wird direkt mit den gemessenen Kilowattstunden gerechnet, ergänzt um eine SoC-Level-Korrektur zwischen den Sessions. Bei älteren Batterien kann der Unterschied bis zu 2 kWh/100km betragen. Alle Werte wurden automatisch aktualisiert.<br><br>Außerdem habe ich jetzt erklärt, warum EV Monitor oft höher liegt als dein Bordcomputer - mit echten Zahlen und der vollständigen Energiekette vom Stromnetz bis zum Motor."
  spritmonitor_raw_refresh_v1_title: "SpritMonitor: Rohdaten nochmals holen"
  spritmonitor_raw_refresh_v1_body: "Beim SpritMonitor-Import gibt es jetzt einen neuen Button 'Rohdaten nochmals importieren'. Er holt das originale JSON erneut von Sprit-Monitor und aktualisiert es, ohne deine manuell korrigierten Werte (kWh, Kilometerstand etc.) zu überschreiben. Das ermöglicht es mir nachträglich Ladungen zu korrigieren und zu verbessern, da das Datenformat von SpritMonitor nicht vollständig dokumentiert ist."
  net_capacity_v1_title: "Fahrzeugdatenbank aktualisiert"
  net_capacity_v1_body: "Die Fahrzeugdatenbank wurde aktualisiert. Bei manchen Batterievarianten wurden die Netto-Kapazitätswerte korrigiert. Dadurch können sich Verbräuche minimal geändert haben."
  brutto_netto_v1_title: "Verbesserte Verbrauchs- und Kostenberechnung"
  brutto_netto_v1_body: "EV Monitor bezieht Netto- und Bruttowerte von gemeldeten Ladevorgängen konsequenter in alle Berechnungen mit ein. Dies kann dazu führen, dass sich Verbrauchs-, Kosten- und Reichweitenangaben leicht angepasst haben. Sie bilden die Realität nun noch besser ab!"
  autosync_live_launch_v1_title: "Vielen Dank an alle Beta-Tester"
  autosync_live_launch_v1_body: "Eure Trip-Daten der letzten Wochen haben mir gezeigt, was funktioniert. Bei Tesla und Polestar reicht die Datenqualität für eine zuverlässige Live-Fahrterkennung. Bei allen anderen Marken ist sie aktuell entweder zu grob, zu unregelmäßig - oder ich habe noch nicht genug Daten, um es ehrlich beurteilen zu können.\n\nDeshalb wird Trip-Detection ab heute Teil von AutoSync Live - für aktuell +1 €/Monat zusätzlich zu AutoSync. Das Feature ist vorerst auf Tesla und Polestar beschränkt. Sobald ich für eine weitere Marke ausreichend Daten in vergleichbarer Güte sehe, schalte ich sie frei."
  autosync_live_launch_v1_cta: "Auf AutoSync Live upgraden"
  tesla_telemetry_rollout_v1_title: "Tesla Live-Sync läuft jetzt über Telemetry"
  tesla_telemetry_rollout_v1_body: "Tesla-Fahrer aufgepasst: Ich habe den Live-Sync von Polling auf Push-basierte Telemetry umgestellt. Dein Auto muss nicht mehr ständig aufwachen, Ladevorgänge kommen direkt rein. Damit es bei dir weiter funktioniert, musst du die Verbindung einmalig neu einrichten - dauert keine 2 Minuten und braucht den Virtual Key in der Tesla-App."
  tesla_telemetry_rollout_v1_cta: "Verbindung einrichten"
  negative_prices_v1_title: "Negative Strompreise werden jetzt unterstützt"
  negative_prices_v1_body: "Bei dynamischen Stromtarifen kann der kWh-Preis unter null fallen. Ab sofort kannst du negative Preise beim Erfassen eingeben - sowohl in der App als auch per API."
  fixed_costs_dashboard_v1_title: "Fixkosten jetzt im Dashboard"
  fixed_costs_dashboard_v1_body: "Versicherung, Steuer, Wartung &amp; Co. lassen sich jetzt unter Fixkosten erfassen. Im Dashboard siehst du die Gesamtkosten deines Autos - aufgeteilt nach Energie und Fixkosten. Der neue Kostenverlauf-Chart zeigt die letzten 12 Monate auf einen Blick. Die Fixkosten hinterlegst du pro Fahrzeug."
  fixed_costs_dashboard_v1_cta: "Fixkosten erfassen"
  feature_survey_v1_title: "Welche Features wünschst du dir?"
  feature_survey_v1_body: "Hilf mir, EV Monitor weiterzuentwickeln! In dieser kurzen Umfrage kannst du abstimmen, welche Features als nächstes kommen sollen, und gern auch etwas vorschlagen."
  feature_survey_v1_cta: "Zur Umfrage"
  spec_charging_efficiency_v1_title: "Genauerer Verbrauch dank modellspezifischer Ladeverluste"
  spec_charging_efficiency_v1_body: "Der Ladeverlust wird jetzt modellspezifisch berechnet - abgeleitet aus echten Ladevorgängen der Community. Statt pauschaler 5% (DC) bzw. 10% (AC) fließen jetzt gemessene Werte pro Fahrzeugmodell in deine Verbrauchsstatistik ein. Je mehr Daten die Community liefert, desto präziser wird die Berechnung."
  spec_charging_efficiency_v1_cta: "Mehr erfahren"

