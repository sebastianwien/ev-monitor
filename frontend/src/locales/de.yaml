cm:
  title: "Warum liegt der Verbrauch in EV Monitor immer über meinem BC?"
  intro: "EV Monitor zeigt dir oft einen höheren Verbrauch als dein Bordcomputer. Das ist kein Fehler - sondern ein Unterschied darin, was gemessen wird."
  s1_title: "Drei Messpunkte, drei verschiedene Werte"
  s1_desc: "Jede kWh die dein Auto bewegt, durchläuft mehrere Stationen. An jeder wird anders gemessen - und alle Werte sind korrekt, sie beantworten nur verschiedene Fragen."
  grid_label: "Stromnetz / Ladesäule"
  grid_desc: "Was du bezahlst. Kommt von der Wallbox, der Ladestation oder der Abrechnung des Anbieters."
  loss1: "~0,82 kWh Ladeverlust (Wärme, AC-DC-Wandlung)"
  battery_label: "Im Akku angekommen"
  battery_desc: "Was das Fahrzeug selbst meldet. Wird von Fahrzeug-APIs (z.B. über Smartcar) direkt übermittelt - EV Monitor rechnet für manuell eingetragene Ladesäulenwerte den Ladeverlust heraus."
  battery_badge: "Basis für EV Monitor Verbrauchsberechnung"
  loss2: "Standby-Verbrauch: Klimatisierung, Fahrzeug-Systeme, Software im Stand (1-3 kWh/Tag)"
  bc_label: "Bordcomputer"
  bc_desc: "Was der Motor während der Fahrt gezogen hat. Standby-Verluste vor und nach der Fahrt sind hier <strong>nicht</strong> enthalten."
  s2_title: "Der entscheidende Punkt: Was EV Monitor nicht sieht"
  s2_desc: "Zwischen Ladeende und Fahrtbeginn - und zwischen Fahrtende und dem nächsten Laden - vergeht Zeit. In dieser Zeit sinkt der SoC. EV Monitor hat keinen Zugriff auf den genauen SoC-Wert <em>beim Start der Fahrt</em>. Nur die zwei Messpunkte an den Ladeenden sind bekannt."
  charge_end: "Ladeende"
  charge_start: "Ladestart"
  trip_start: "Fahrtbeginn"
  trip_end: "Fahrtende"
  known: "EV Monitor kennt diesen Wert"
  unknown: "EV Monitor kennt diesen Wert <strong>nicht</strong>"
  standby_loss: "Standby-Verlust (Dauer unbekannt)"
  trip_segment: "Fahrt 236 km - das sieht der Bordcomputer"
  s2_info: "<strong>Was das bedeutet:</strong> EV Monitor sieht nur den Sprung von 87% auf 26% - also 61 Prozentpunkte. Ob davon 57% auf die Fahrt und 4% auf Standby entfallen, oder 59% auf die Fahrt und 2% auf Standby, ist von außen nicht messbar. Der gesamte Energiebedarf dieser Periode ist aber real - und EV Monitor bildet ihn vollständig ab."
  s3_title: "Wie EV Monitor rechnet"
  s3_desc: "EV Monitor erfasst die Energie zwischen zwei Ladevorgängen - nicht nur während der Fahrt. Das schließt Standby-Verluste ein, die real verloren gehen und sich in der nächsten Stromrechnung wiederfinden."
  formula: "Verbrauch = (kWh geladen + SoC-Korrektur) / Strecke × 100"
  soc_correction: "<strong>Was ist die SoC-Korrektur?</strong><br>Du lädst nie von 0% auf 100%. Die Korrektur gleicht aus, wenn der Akku nach diesem Laden voller oder leerer ist als nach dem vorherigen Laden - damit wird nur der Verbrauch der tatsächlich gefahrenen Strecke berechnet, nicht mehr und nicht weniger."
  s4_title: "Warum EV Monitor höher liegt als der Bordcomputer"
  s4_desc: "Das ist kein Fehler. Der Bordcomputer misst nur was der Antrieb während der Fahrt braucht. Energie die das Fahrzeug im Stand verbraucht, erscheint im Bordcomputer nicht, ist aber real verloren gegangen und muss nachgeladen werden."
  per_day: "Tag"
  stat1_desc: "Durchschnittliche Differenz zwischen realem Verbrauch und Bordcomputer-Anzeige laut unabhängiger Forschung."
  stat2_desc: "Typischer Standby-Verbrauch eines E-Autos im geparkten Zustand, je nach Fahrzeug, Temperatur und Software-Version."
  s5_title: "Die unvermeidbare Unschärfe"
  s5_intro: "Keine Methode ist perfekt - das liegt in der Natur der Messung:"
  bullet1: "<strong>SoC-Werte</strong> werden von EV Monitor als ganze Prozentzahl gespeichert. 1% entspricht je nach Akkugröße ca. 0,5-0,7 kWh - das ist eine messbare Ungenauigkeit."
  bullet2: "<strong>kWh-Werte vom Fahrzeug</strong> werden vom Fahrzeug-BMS oder der Hersteller-API gemeldet und von Diensten wie Smartcar unverändert weitergegeben. Die Präzision hängt vom Fahrzeughersteller ab."
  bullet3: "<strong>Wallbox- und Ladestationsmessungen</strong> haben herstellerabhängige Messtoleranzen."
  bullet4: "<strong>Standby-Verluste</strong> variieren stark je nach Außentemperatur, Software-Version und Nutzungsverhalten."
  s5_footer: "EV Monitor verwendet den Median über mehrere Ladevorgänge um Ausreißer herauszuglätten, und markiert einzelne Trips mit einem Plausibilitäts-Indikator wenn der berechnete Wert ungewöhnlich erscheint."
  sources_title: "Quellen"

xpeng:
  eyebrow_brand: "XPeng · EU Data Act"
  eyebrow_step1: "Anfrage stellen"
  eyebrow_step2: "Upload"
  intro_title: "XPeng EU-Data-Act Import"
  intro_body: "Da XPeng (noch) keine API anbietet, importierst du deine Telematik-Daten per Excel: Du forderst sie bei XPeng per E-Mail an, erhältst sie nach 5-10 Tagen zurück und lädst sie hier hoch."
  no_xpeng_cars: "Keine XPeng-Fahrzeuge in deiner Garage."
  autosync_intro_eyebrow: "XPeng AutoSync"
  autosync_intro_title: "Deine XPeng-Daten kommen von selbst"
  autosync_intro_no_api: "Für XPeng gibt es bisher keine offizielle Schnittstelle, über die Apps die Fahrzeugdaten abrufen können. Ein direkter Abruf aus dem Auto ist damit aktuell noch nicht möglich."
  autosync_intro_data_act: "Es gibt aber den EU Data Act - eine europäische Verordnung, nach der die Daten deines Fahrzeugs dir gehören. Du kannst sie beim Hersteller anfordern und bekommst sie per E-Mail als Excel-Tabelle. Genau diesen Weg nutzen wir für dich."
  autosync_intro_steps_title: "Was dann passiert"
  autosync_intro_step1: "Du erlaubst uns einmal, in deinem Namen bei XPeng anzufragen, und sagst uns, welche E-Mail-Adresse du bei XPeng hinterlegt hast."
  autosync_intro_step2: "Wir schreiben die Anfrage an XPengs Datenschutz-Abteilung - rechtlich sauber formuliert, du musst dich um nichts kümmern. Du bekommst jede Anfrage in Kopie und siehst mit, was in deinem Namen passiert."
  autosync_intro_step3: "XPeng antwortet nach ein paar Tagen mit einer Excel-Tabelle. Sie ist mit einem Passwort geschützt und geht direkt an unser Postfach."
  autosync_intro_step4: "Wir öffnen die Tabelle automatisch, lesen deine Ladevorgänge und Fahrten heraus und tragen sie in dein Logbuch ein. Du musst nichts hochladen und nichts abtippen."
  autosync_intro_step5: "Alle 14 Tage stellen wir die Anfrage erneut, damit deine neuen Fahrten nachkommen. Ab hier läuft es dauerhaft von allein."
  autosync_intro_manual_hint: "Du möchtest die Anfrage lieber selbst an XPeng schicken und die Excel-Datei danach von Hand hochladen?"
  autosync_intro_manual_link: "Zum manuellen XPeng-Import"
  autosync_prompt_eyebrow: "Fahrzeug angelegt"
  autosync_prompt_title: "AutoSync für deinen XPeng einrichten?"
  autosync_prompt_later: "Später einrichten"
  autosync_prompt_later_hint: "Du findest AutoSync jederzeit unter Importe."
  autosync_prompt_success_title: "AutoSync ist eingerichtet"
  autosync_prompt_success_body: "Wir stellen die erste Anfrage an XPeng und tragen deine Fahrten und Ladevorgänge ein, sobald die Antwort da ist. Jede Anfrage bekommst du in Kopie."
  step_consent_title: "Datenverarbeitung freigeben"
  step_request_title: "Daten bei XPeng anfordern"
  step_request_body: "Öffne dein Mailprogramm. Die Anfrage ist vorausgefüllt, du musst sie nur absenden. XPeng schickt dir innerhalb von 5-10 Tagen eine verschlüsselte Excel-Datei zurück."
  step_upload_title: "Excel hochladen"
  car_label: "Fahrzeug"
  vin_label: "Fahrzeug-Identifikationsnummer (VIN)"
  vin_hint: "17 Zeichen, findest du im Fahrzeugschein oder in der XPeng-App."
  consent_show_full: "Vollständigen Einwilligungstext anzeigen"
  consent_full_text: |
    Ich willige gemäß Art. 6 Abs. 1 lit. a DSGVO ein, dass Sebastian Wien, Berlin, Deutschland (Betreiber des Dienstes "EV Monitor", https://ev-monitor.net - vollständige Anschrift im Impressum) die Telematik-Daten meines XPeng-Fahrzeugs (identifiziert durch die angegebene VIN), die ich aus dem EU-Data-Act-Export (Verordnung (EU) 2023/2854) selbst bei XPeng anfordere und in EV Monitor hochlade, verarbeitet.

    Die Verarbeitung umfasst: Entschlüsseln der Datei, Auslesen relevanter Telematik-Signale, Aggregation zu Fahrten (Trips) und Ladevorgängen, Anzeige in meinem persönlichen EV-Monitor-Account sowie Speicherung dieser Aggregate. Die hochgeladene Excel-Datei selbst wird nach der Verarbeitung gelöscht.

    Die Verarbeitung erfolgt ausschließlich zum Zweck der Trip- und Lade-Analyse meines Fahrzeugs. Eine Weitergabe an Dritte findet nicht statt.

    Ich kann diese Einwilligung jederzeit ohne Angabe von Gründen widerrufen, indem ich die Verbindung in EV Monitor lösche. Bereits importierte Aggregate (Trips, Ladevorgänge) bleiben in meinem Account erhalten, bis ich sie manuell lösche. Der Widerruf berührt nicht die Rechtmäßigkeit der bis dahin erfolgten Verarbeitung.

    Hinweis: In dieser Phase (manueller Upload) erfolgt die Anforderung der Daten bei XPeng durch mich selbst per E-Mail. Sollte EV Monitor diesen Schritt in Zukunft im meinem Namen übernehmen, werde ich vorab um eine separate, dafür spezifische Vollmacht gemäß Art. 5 EU Data Act gebeten.
  consent_accept_label: "Ich willige in die Verarbeitung der hochgeladenen Daten wie oben beschrieben ein."
