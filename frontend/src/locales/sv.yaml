  step_consent_title: "Tillåt databehandling"
  step_request_title: "Begär data från XPeng"
  step_request_body: "Öppna din e-postklient. Förfrågan är förifylld, du behöver bara skicka den. XPeng svarar inom 5-10 dagar med en krypterad Excel-fil."
  step_upload_title: "Ladda upp export"
  upload_howto: "Begär din EU Data Act-export i XPeng-portalen och ladda upp den nedladdade ZIP-filen här. Vi identifierar VIN automatiskt och kopplar den till din bil."
  car_label: "Fordon"
  vin_label: "Chassinummer (VIN)"
  vin_hint: "17 tecken, finns i registreringsbeviset eller i XPeng-appen."
  consent_show_full: "Visa fullständig samtyckestext"
  consent_full_text: |
    Jag samtycker, enligt art. 6.1 a GDPR, till att Sebastian Wien, Berlin, Tyskland (operatör av tjänsten "EV Monitor", https://ev-monitor.net - fullständig adress i webbplatsens imprint) behandlar telematikdata för mitt XPeng-fordon (identifierat med ovan angivna VIN) som jag själv begär från XPeng enligt EU Data Act (Förordning (EU) 2023/2854) och laddar upp i EV Monitor.

    Behandlingen omfattar: dekryptering av filen, extraktion av relevanta telematiksignaler, aggregering till resor och laddsessioner, visning på mitt personliga EV Monitor-konto samt lagring av dessa aggregat. Den uppladdade Excel-filen raderas efter behandling.

    Behandlingen sker enbart för att analysera resor och laddning av mitt fordon. Inga data delas med tredje part.

    Jag kan när som helst återkalla samtycket utan motivering genom att ta bort kopplingen i EV Monitor. Aggregat som redan importerats (resor, laddsessioner) finns kvar på mitt konto tills jag tar bort dem manuellt. Återkallelsen påverkar inte lagligheten av behandlingen fram till återkallelsetidpunkten.

    Obs: I denna fas (manuell uppladdning) begär jag själv data från XPeng via e-post. Skulle EV Monitor i framtiden överta detta steg i mitt namn, kommer jag i förväg att tillfrågas om en separat, specifik fullmakt enligt art. 5 EU Data Act.
