  xpeng_supporter_eyebrow: "Få ut mer av dina data"
  xpeng_supporter_headline: "Som supporter får du några extrafunktioner"
  xpeng_supporter_subline: "Du låser upp fler instrumentpanel-widgetar och stöttar mig med utveckling och drift - så förblir EV Monitor oberoende."
  xpeng_supporter_cta: "Visa Supporter-paketet"
  unlock_title: "Vad AutoSync gör synligt för dig"
