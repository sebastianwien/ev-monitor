  consent_full_text_v2: |
    Jag bemyndigar Sebastian Wien, Berlin, Tyskland (operatör av tjänsten «EV Monitor», https://ev-monitor.net) som auktoriserad datamottagare enligt art. 5 i förordning (EU) 2023/2854 (EU Data Act):

    1. Att automatiskt skicka en dataförfrågan enligt art. 4 EU Data Act till XPeng (data-privacy{'@'}xiaopeng.com) var 14:e dag å mina vägnar, med mig inkluderad som kopia.
    2. Att ta emot, dekryptera och behandla svar-e-post från XPeng med mina telematikdata (Excel-bilaga), inklusive aggregering till resor och laddningssessioner och lagring i mitt konto. Excel-filen raderas efter behandling.

