  b_savings_t: "Vad hemmaladdning faktiskt sparar dig"
  b_savings_d: "Att ladda hemma är billigare än på vägen. Varje månad räknar vi ut hur mycket det gav dig."
  b_split_t: "Vart tar din energi vägen?"
  b_split_d: "För första gången ser du svart på vitt hur mycket som går till körning, hur mycket som försvinner medan bilen står och hur mycket som förloras under laddning."
  b_idle_t: "Vad kostar stillastående dig?"
