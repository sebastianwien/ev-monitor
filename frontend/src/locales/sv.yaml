autosync_page:
  back: "Tillbaka"
  kicker: "AutoSync"
  title: "Din bil för bok. Du lutar dig tillbaka."
  lead: "Varje laddning hamnar automatiskt i din loggbok - med datum, kWh och kostnad, utan att du skriver in något. Och siffrorna som din bil ändå producerar blir äntligen till svar."
  story_p1: "Jag byggde EV Monitor för att hålla koll på mina laddningar, min förbrukning och mina kostnader - utan att skriva in siffror efter varje laddning."
  story_p2: "AutoSync kopplar din bil en gång. Från och med då kommer varje laddning in av sig själv, ren och komplett. Inget kalkylark på Google Drive, ingen glömd session."
  story_p3: "Den verkliga vinsten kommer efteråt: EV Monitor räknar ut åt dig vart din energi tar vägen, vad stillastående kostar dig och var det finns verklig besparingspotential."
  tesla_note_body: "Kör du Tesla? Då är datainsamlingen redan gratis för dig - det enda som saknas är analysen."
  tesla_note_cta: "Till Supporter-paketet"
  xpeng_eyebrow: "XPeng · EU Data Act"
  xpeng_title: "Hämta dina XPeng-data gratis"
  xpeng_body: "XPeng bygger just nu en officiell anslutning - så någon automatisk realtidsavläsning finns ännu inte. Men tack vare EU Data Act kan du redan i dag begära dina kör- och laddningsdata själv som en ZIP i XPeng-portalen. Ladda upp dem här - resor och laddningar läses ut automatiskt, gratis och utan att skriva in något."
