supporter:
  data_source_note_title: "Din data kommer redan in automatiskt"
  data_source_note_body: "Som Tesla-förare är datainsamlingen redan gratis för dig - laddningar och resor hamnar automatiskt i din loggbok. Det Supporter-paketet ger utöver detta är inte mer datainsamling utan analysen: djupet bakom siffrorna du redan skickar in."
  back: "Tillbaka"
  hero_kicker: "Öppen källkod · reklamfri · oberoende"
  title: "Bli supporter"
  lead: "EV Monitor tillhör ingen koncern - bara människorna som använder det. Gillar du det kan du hjälpa till att hålla det så."
  story_p1: "EV Monitor började som ett hobbyprojekt: jag ville bygga en modern laddlogg som hjälper mig att hålla koll på mina kostnader och min förbrukning. Med hjälp av gemenskapen ska det dessutom byggas ett dataunderlag som hjälper andra att fatta ett köpbeslut."
  story_p2: "Hela kodbasen är öppen källkod. Ingen reklam, ingen datahandel, inga investerare som kräver tillväxt till varje pris. Men det betyder också: EV Monitor bärs enbart av människorna som frivilligt stödjer det."
  story_p3: "Ditt bidrag håller servrarna igång och ger mig tid att bygga vidare. Som tack låser Supporter-paketet upp djupare analyser av din data."
  unlock_title: "Vad Supporter-paketet låser upp"
  u_voice: "Röstlogg: tala in laddningen vid laddaren i stället för att skriva, 30 i stället för 5 inspelningar i månaden."
  u_savings: "Vad hemmaladdning faktiskt sparar jämfört med publik laddning - och när din laddbox har betalat sig."
  u_analytics: "Dashboard-widget: en detaljerad uppdelning av din energifördelning, parkeringsförluster och kostnaden, plus en sträckanalys."
  u_phantom: "Parkeringsförluster i detalj - varje förlust mellan resorna, med kWh och kostnad."
  u_curves: "Laddkurvor - de fullständiga DC-snabbladdningskurvorna för varje laddning."
  u_trips: "Resor i detalj - vilka förbrukare som var igång (värme, klimatanläggning, batteriförvärmning) och hur fort du körde. Utan paketet ser du detta bara på din senaste resa, med det på varje."
