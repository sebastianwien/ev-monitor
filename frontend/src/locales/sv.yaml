  autosync_intro_no_api: "För XPeng finns ännu inget officiellt gränssnitt som låter appar hämta fordonsdata. Att läsa dem direkt från bilen är därför inte möjligt i dagsläget."
  autosync_intro_data_act: "Däremot finns EU:s dataakt - en europeisk förordning som slår fast att uppgifterna från ditt fordon tillhör dig. Du kan begära ut dem från tillverkaren och får dem via e-post som ett Excel-ark. Det är den vägen vi använder åt dig."
  autosync_intro_steps_title: "Vad som händer sedan"
  autosync_intro_step1: "Du ger oss en gång tillåtelse att fråga XPeng i ditt namn och anger vilken e-postadress du har registrerat hos XPeng."
  autosync_intro_step2: "Vi skriver till XPengs dataskyddsavdelning - juridiskt korrekt formulerat, du behöver inte göra något. Du står med som kopia på varje begäran och ser vad som sker i ditt namn."
