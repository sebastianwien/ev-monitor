user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DSGVO: IP-Adressen vor dem Loggen kürzen (IPv4: letztes Oktett, IPv6: alles nach dem /32).
    # Die Logs enthalten damit keine personenbezogenen Daten mehr und dürfen länger vorgehalten werden.
    map $remote_addr $remote_addr_anon {
        ~(?P<ip>\d+\.\d+\.\d+)\.\d+          $ip.0;
        ~(?P<ip>[^:]+:[^:]+):.*                $ip::;
        default                              0.0.0.0;
    }

    log_format  main  '$remote_addr_anon - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    log_format  prerender  '$time_local | PRERENDER | $remote_addr_anon | "$request" | $status | "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
