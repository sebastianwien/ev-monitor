# Ziel für alle Backend-Requests. Default für lokalen Bau und Community-Setup (Dienst "backend").
# Auf Prod liegt hier ein Mount von /opt/ev-monitor/nginx-state, den der Blue/Green-Deploy
# auf backend-blue bzw. backend-green umschreibt.
upstream backend_app {
    zone backend_app 64k;
    server backend:8080 resolve;
}
